<title>SPADE Research Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* layout concept: a lab notebook. Left rail of sections, one reading column, figures that carry numbers from the result files. */
:root{--bg:#f6f7f9;--panel:#ffffff;--fg:#1b2430;--muted:#5b6675;--line:#d8dde4;--accent:#176b87;--accent-soft:#dcedf3;--ours:#c2570c;--ours-soft:#fbe6d6;--good:#2c7a54;--good-soft:#dcefe4;--warn:#9a6a05;--warn-soft:#faf0d2;--bad:#a8372f;--bad-soft:#f6dedb;--code:#eef1f5;--grid:#e3e7ec;--c1:#176b87;--c2:#c2570c;--c3:#7a8594;--c4:#6a4c93;--c5:#2c7a54}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--panel:#18202a;--fg:#e4e9ef;--muted:#9aa6b5;--line:#2c3744;--accent:#5fb4d0;--accent-soft:#17323d;--ours:#f08a45;--ours-soft:#3a2415;--good:#6cc596;--good-soft:#15301f;--warn:#e0b04a;--warn-soft:#352a0c;--bad:#ee8279;--bad-soft:#3a1c19;--code:#1e2733;--grid:#25303c;--c1:#5fb4d0;--c2:#f08a45;--c3:#8895a6;--c4:#b79ae0;--c5:#6cc596;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--panel:#18202a;--fg:#e4e9ef;--muted:#9aa6b5;--line:#2c3744;--accent:#5fb4d0;--accent-soft:#17323d;--ours:#f08a45;--ours-soft:#3a2415;--good:#6cc596;--good-soft:#15301f;--warn:#e0b04a;--warn-soft:#352a0c;--bad:#ee8279;--bad-soft:#3a1c19;--code:#1e2733;--grid:#25303c;--c1:#5fb4d0;--c2:#f08a45;--c3:#8895a6;--c4:#b79ae0;--c5:#6cc596;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.65 "Source Sans 3",system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:2.1rem}h2{font-size:1.6rem;margin-top:3rem;padding-top:.5rem;border-top:2px solid var(--line)}h3{font-size:1.2rem;margin-top:2rem}h4{font-size:1rem;margin:1.4rem 0 .3rem;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:2.5rem;max-width:1240px;margin:0 auto;padding-block:1.5rem 5rem}
nav.rail{position:sticky;top:1rem;align-self:start;font-size:.9rem;max-height:calc(100vh - 2rem);overflow:auto}
nav.rail a{display:block;padding:.25rem .6rem;border-left:3px solid var(--line);color:var(--muted);text-decoration:none}
nav.rail a:hover,nav.rail a.on{border-color:var(--accent);color:var(--fg)}
nav.rail .nm{font-family:"Source Serif 4",serif;font-weight:700;margin-bottom:.6rem;display:block}
main{min-width:0;max-width:880px}
p{margin:.7rem 0}
.lead{font-size:1.08rem;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1rem 1.2rem;margin:1rem 0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem;margin:1rem 0}
.grid3 .card{margin:0}
.tag{display:inline-block;font:500 .72rem "JetBrains Mono",monospace;padding:.1rem .45rem;border-radius:3px;margin-right:.3rem;letter-spacing:.02em}
.t-good{background:var(--good-soft);color:var(--good)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-info{background:var(--accent-soft);color:var(--accent)}.t-ours{background:var(--ours-soft);color:var(--ours)}
pre,code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.82rem}
pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem;overflow-x:auto;line-height:1.55;margin:.8rem 0}
code{background:var(--code);padding:.05rem .3rem;border-radius:3px}
pre code{background:none;padding:0}
details{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.4rem 1rem;margin:.8rem 0}
details>summary{cursor:pointer;font-weight:600;padding:.35rem 0}
figure{margin:1.2rem 0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.8rem 1rem}
figcaption{font-size:.88rem;color:var(--muted);margin-top:.5rem}
.chartbox{position:relative;height:300px}
.chartbox.tall{height:380px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:.45rem .6rem;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem}
.tabs button,.ctl button{font:inherit;font-size:.85rem;padding:.25rem .7rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:4px;cursor:pointer}
.tabs button.on,.ctl button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.ctl{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin:.5rem 0}
input[type=text],select{font:inherit;font-size:.9rem;padding:.3rem .5rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:4px;min-width:0}
input[type=range]{accent-color:var(--accent);min-width:0;max-width:100%}
.note{border-left:4px solid var(--warn);background:var(--warn-soft);padding:.6rem .9rem;border-radius:0 6px 6px 0;margin:1rem 0;font-size:.95rem}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}.note.good{border-color:var(--good);background:var(--good-soft)}.note.info{border-color:var(--accent);background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr);gap:.2rem .8rem;font-size:.92rem}
.kv b{color:var(--muted);font-weight:600}
.big{font:700 2rem "Source Serif 4",serif;color:var(--ours)}
.paper{border-bottom:1px solid var(--line);padding:.6rem 0}
.paper .r{font-weight:600}.paper .w{color:var(--fg)}.paper .m{color:var(--muted);font-size:.88rem}
svg text{fill:var(--fg);font-family:"Source Sans 3",sans-serif}
@media (max-width:940px){.shell{grid-template-columns:minmax(0,1fr)}nav.rail{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:.2rem}nav.rail a{border-left:0;border-bottom:2px solid var(--line)}h1{font-size:1.7rem}.chartbox{height:260px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
